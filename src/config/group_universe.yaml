# Group universe — collapses near-substitute assets in `asset_universe.yaml`
# into groups so the mapper makes one decision per group instead of one per
# asset.
#
# Design: docs/superpowers/specs/2026-04-27-asset-group-universe-design.md
#
# Schema:
#   <group_key>:
#     name: <human-readable group name, used in prompts>
#     asset_class: one of {commodity, US equity sector, equity index,
#                          volatility, currency, rates}
#     keywords: <bare-minimum list for the pre-filter gate — the shortest set
#                that catches the articles the LLM tags for this group. A more
#                specific term that always co-occurs with a general one is left
#                out (no "WTI" under Crude Oil when "oil"/"crude" are present).
#                US equity sectors have no clean anchor, so their lists are
#                rough and expected to score low recall -> always-run.
#                Used by scripts/measure_gate.py and scripts/regex_mapper.py.>
#     members:
#       - name: <asset name matching `name:` in asset_universe.yaml>
#         ticker_symbol: <stable trading ticker; primary stable identifier>

### ENERGY COMMODITIES ###

crude_oil:
  name: Crude Oil
  asset_class: commodity
  keywords: [oil, crude]
  members:
    - name: WTI Crude Oil
      ticker_symbol: 'CL'
    - name: Brent Crude Oil
      ticker_symbol: 'BRN'

refined_petroleum:
  name: Refined Petroleum
  asset_class: commodity
  keywords: [gasoline, diesel, "heating oil", refinery, refineries, refining, refined, refiners, fuel, fuels, petroleum, gas]
  members:
    - name: Heating Oil
      ticker_symbol: 'HO'
    - name: RBOB Gasoline (replaces NY Harbor Unleaded Gasoline, pre-2006)
      ticker_symbol: 'RB'
    - name: ICE Gas Oil
      ticker_symbol: 'G'

natural_gas:
  name: Natural Gas
  asset_class: commodity
  keywords: [gas, lng]
  members:
    - name: Natural Gas
      ticker_symbol: 'NG'

