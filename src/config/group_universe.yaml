# Group universe — collapses near-substitute assets in `asset_universe.yaml`
# into groups so the mapper makes one decision per group instead of one per
# asset.
#
# Design: docs/superpowers/specs/2026-04-27-asset-group-universe-design.md
#
# Schema:
#   <group_key>:
#     name: <human-readable group name, used in prompts>
#     asset_class: one of {commodity, US equity sector, equity index,
#                          volatility, currency, rates}
#     keywords: <bare-minimum list for the pre-filter gate — the shortest set
#                that catches the articles the LLM tags for this group. A more
#                specific term that always co-occurs with a general one is left
#                out (no "WTI" under Crude Oil when "oil"/"crude" are present).
#                TWO consumers, and they disagree about what a false positive
#                costs. src/mapping/gate.py skips the LLM call when none of a
#                group's keywords appear, so a loose keyword is nearly free (the
#                model still rejects the pair). src/kg/link_groups.py uses the
#                same list to link entities to groups, with no model in the loop,
#                so a loose keyword there is a spurious edge. Broadening for gate
#                recall costs KG link precision. Edit with both in view.
#                US equity sectors have no clean lexical anchor, so their lists
#                are the weak ones: they carry 66% of every correct tag the gate
#                loses (12.2% of sector tags, vs 0.2% for commodities). Exempting
#                them would cost 389 extra B200-hours. Revisit; do not assume.>
#     members:
#       - name: <asset name matching `name:` in asset_universe.yaml>
#         ticker_symbol: <stable trading ticker; primary stable identifier>
#         short_name: <concise display name used in KG extraction prompts>

### ENERGY COMMODITIES ###

crude_oil:
  name: Crude Oil
  asset_class: commodity
  keywords: [oil, crude]
  members:
    - name: WTI Crude Oil
      ticker_symbol: 'CL'
      short_name: WTI Crude Oil
    - name: Brent Crude Oil
      ticker_symbol: 'BRN'
      short_name: Brent Crude Oil

refined_petroleum:
  name: Refined Petroleum
  asset_class: commodity
  keywords: [gasoline, diesel, "heating oil", refinery, refineries, refining, refined, refiners, fuel, fuels, petroleum, gas]
  members:
    - name: Heating Oil
      ticker_symbol: 'HO'
      short_name: Heating Oil
    - name: RBOB Gasoline (replaces NY Harbor Unleaded Gasoline, pre-2006)
      ticker_symbol: 'RB'
      short_name: RBOB Gasoline
    - name: ICE Gas Oil
      ticker_symbol: 'G'
      short_name: ICE Gas Oil

natural_gas:
  name: Natural Gas
  asset_class: commodity
  keywords: [gas, lng]
  members:
