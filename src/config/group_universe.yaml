# Group universe — collapses near-substitute assets in `asset_universe.yaml`
# into groups so the mapper makes one decision per group instead of one per
# asset.
#
# Design: docs/superpowers/specs/2026-04-27-asset-group-universe-design.md
#
# Schema:
#   <group_key>:
#     name: <human-readable group name, used in prompts>
#     asset_class: one of {commodity, US equity sector, equity index,
#                          volatility, currency, rates}
#     members:
#       - name: <asset name matching `name:` in asset_universe.yaml>
#         ticker_symbol: <stable trading ticker; primary stable identifier>

### ENERGY COMMODITIES ###

crude_oil:
  name: Crude Oil
  asset_class: commodity
  members:
    - name: WTI Crude Oil
      ticker_symbol: 'CL'
    - name: Brent Crude Oil
      ticker_symbol: 'BRN'

refined_petroleum:
  name: Refined Petroleum
  asset_class: commodity
  members:
    - name: Heating Oil
      ticker_symbol: 'HO'
    - name: RBOB Gasoline (replaces NY Harbor Unleaded Gasoline, pre-2006)
      ticker_symbol: 'RB'
    - name: ICE Gas Oil
      ticker_symbol: 'G'

natural_gas:
  name: Natural Gas
  asset_class: commodity
  members:
    - name: Natural Gas
      ticker_symbol: 'NG'

