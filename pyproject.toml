[project]
name = "macronews"
version = "0.1.0"
description = "NLP pipeline for global macro futures return prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.8",
    "huggingface-hub>=1.6.0",
    "matplotlib>=3.8",
    "numpy",
    "polars[u64-idx]>=1.38.1",
    "pydantic>=2.12",
    "pypdf>=6.7.5",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.0",
    "requests>=2.32.5",
    "sentence-transformers>=3.0",
    "trafilatura>=2.0.0",
    "vllm>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]

[project.scripts]
macronews = "macronews.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
macronews = [
    "config/*.yaml",
    "mapping/prompts/*.txt",
    "mapping/prompts/asset_class/*.txt",
    "mapping/grading/prompts/*.txt",
    "kg/prompts/*.txt",
    "kg/grading/prompts/*.txt",
    "kg/templates/*.template",
    "kg/assets/*",
]

[tool.pytest.ini_options]
# pytest collects by filesystem walk, so without this a bare `pytest` also picks up the
# gitignored one-off analysis scripts under scripts/misc/ and their stale tests.
testpaths = ["tests"]
